name: Veritas Software
description: 'Veritas Technologies (originally Veritas Software) is an enterprise data
  management and protection vendor whose products — NetBackup, Alta, Backup Exec, and
  InfoScale — expose RESTful APIs for automating backup, recovery, storage provisioning,
  and data governance. NetBackup ships Swagger/OpenAPI-documented REST APIs served from
  the master server, with first-party code samples published under the VeritasOS GitHub
  organization. The company runs a public trust and compliance program covering SOC 2,
  FedRAMP, HIPAA, FIPS 140, GDPR, and CCPA. Accel is among its historical investors.'
